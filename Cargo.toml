[workspace]
resolver = "2"
members = ["crates/core", "crates/native", "crates/ui", "apps/oxtree"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/nikolainyegaard/OxTree"

[workspace.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
oxtree-core = { path = "crates/core" }
oxtree-native = { path = "crates/native" }
oxtree-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
