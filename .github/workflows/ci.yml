name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy --all-targets --features diagnostics -- -D warnings
      - run: cargo test --features diagnostics

  ports:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --features diagnostics
      - if: runner.os == 'Windows'
        run: cargo build --release --features diagnostics
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: oxtree-windows-diagnostics
          path: target/release/oxtree.exe
